var PER = 10, PAGES = Math.ceil(DATA.length / PER);
document.getElementById('total').textContent = DATA.length;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function page(){var m = location.hash.match(/page=(\d+)/);var p = m ? parseInt(m[1],10) : 1;if(!p || p < 1) p = 1;if(p > PAGES) p = PAGES;return p;}
function render(){
  var p = page();
  var rows = DATA.slice((p-1)*PER, p*PER).map(function(a){
    return '<tr><td><a href="' + esc(a.u) + '">' + esc(a.t) + '</a></td><td class="en">' + esc(a.e || '') + '</td><td class="date">' + esc(a.d) + '</td><td class="src">' + esc(a.s || '') + '</td></tr>';
  }).join('');
  document.getElementById('rows').innerHTML = rows;
  var pg = '';
  pg += p > 1 ? '<a href="#page=' + (p-1) + '">上一页</a>' : '<span class="dis">上一页</span>';
  for(var i = 1; i <= PAGES; i++){
    pg += i === p ? '<span class="cur">' + i + '</span>' : '<a href="#page=' + i + '">' + i + '</a>';
  }
  pg += p < PAGES ? '<a href="#page=' + (p+1) + '">下一页</a>' : '<span class="dis">下一页</span>';
  pg += '<div style="margin-top:10px;color:#888;font-size:13px">第 ' + p + ' / ' + PAGES + ' 页</div>';
  document.getElementById('pager').innerHTML = pg;
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();
